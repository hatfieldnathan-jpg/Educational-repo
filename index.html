<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        poki: {
                            purple: '#7b2cbf',
                            violet: '#9d4edd',
                            pink: '#ff007f',
                            yellow: '#ffbe0b',
                            blue: '#3a86ef',
                            darkBg: '#0f0e17',
                            darkCard: '#1a1829',
                            darkHover: '#25223c',
                            lightBg: '#f3f4f6',
                            lightCard: '#ffffff'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.75rem'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: #7b2cbf; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff007f; }

        .poki-card { transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .poki-card:hover { transform: translateY(-6px) scale(1.02); }
    </style>
</head>
<body class="bg-poki-lightBg dark:bg-poki-darkBg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- TOP NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-poki-darkCard/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">

            <!-- Logo -->
            <a href="./" class="flex items-center gap-3 group">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-poki-purple via-poki-pink to-poki-yellow p-1 shadow-lg group-hover:rotate-6 transition-transform">
                    <div class="w-full h-full bg-slate-900 rounded-[12px] flex items-center justify-center text-white text-2xl font-black tracking-tighter">
                        P<span class="text-poki-pink">!</span>
                    </div>
                </div>
                <span class="text-2xl font-black tracking-wider uppercase bg-gradient-to-r from-poki-purple via-poki-pink to-poki-yellow bg-clip-text text-transparent">POKI</span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search games..."
                        class="w-full pl-11 pr-4 py-2.5 rounded-full bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700/60 focus:outline-none focus:ring-2 focus:ring-poki-purple transition-all text-sm font-medium">
                </div>
            </div>

            <!-- Dark Mode Toggle -->
            <button id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition-all">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:inline text-poki-yellow"></i>
            </button>
        </div>

        <!-- Mobile Search Bar -->
        <div class="px-4 pb-3 md:hidden">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="mobileSearchInput" placeholder="Search games..."
                    class="w-full pl-11 pr-4 py-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-poki-purple text-sm">
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">

        <!-- SECTION HEADING -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tracking-tight flex items-center gap-2">
                <i class="fas fa-fire text-poki-pink"></i>
                <span>All Games</span>
            </h2>
            <span class="text-xs font-semibold text-slate-500 dark:text-slate-400" id="gameCountBadge">Loading...</span>
        </div>

        <!-- GAME CARDS GRID -->
        <div id="gamesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5"></div>

        <!-- Empty / Error State -->
        <div id="messageState" class="hidden py-16 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center text-3xl text-slate-400">
                <i class="fas fa-gamepad"></i>
            </div>
            <h3 id="messageTitle" class="text-lg font-bold text-slate-700 dark:text-slate-200"></h3>
            <p id="messageBody" class="text-sm text-slate-500 dark:text-slate-400 mt-1"></p>
        </div>

    </main>

    <!-- GAME LAUNCHER MODAL -->
    <div id="gameModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 md:p-6 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-5xl h-[92vh] max-h-[850px] rounded-3xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="gameModalContent">

            <!-- Modal Top Bar -->
            <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="modalGameIcon" class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-poki-purple to-poki-pink flex items-center justify-center text-white text-xl font-bold shadow-md">
                        <i class="fas fa-gamepad"></i>
                    </div>
                    <h3 id="modalGameTitle" class="text-lg font-bold text-white leading-tight truncate">Game Title</h3>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-poki-purple hover:bg-poki-violet text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-md">
                        <i class="fas fa-expand"></i>
                        <span class="hidden sm:inline">Fullscreen</span>
                    </button>
                    <button onclick="closeGameModal()" aria-label="Close game" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-400 flex items-center justify-center transition-all">
                        <i class="fas fa-times text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Game Iframe -->
            <div class="flex-1 relative bg-black overflow-hidden">
                <iframe id="gameIframe" class="w-full h-full border-0 bg-slate-950" allow="fullscreen; autoplay; keyboard"></iframe>
            </div>

            <!-- Controls bar -->
            <div class="bg-slate-900 border-t border-slate-800 p-3 sm:p-4 flex items-center gap-3 shrink-0 text-xs text-slate-400">
                <span class="font-bold text-slate-300 flex items-center gap-1.5">
                    <i class="fas fa-gamepad text-poki-pink"></i> Controls:
                </span>
                <span id="modalControlsGuide">Use keyboard or touch to play.</span>
            </div>

        </div>
    </div>

    <script>
        /* ==========================================================================
           SETTINGS
           This page asks GitHub which .html files are in your Games folder, so any
           file you add there shows up as a new game.

           Leave REPO_OWNER and REPO_NAME empty and the page works them out from the
           site address. Only fill them in if the games never show up.
           GAMES_FOLDER must match your folder name exactly (capital G).
           ========================================================================== */
        const REPO_OWNER = '';
        const REPO_NAME = '';
        const GAMES_FOLDER = 'Games';
        const CACHE_KEY = 'games_list_backup';

        /* ==========================================================================
           GAME DETAILS (optional)
           Give a game a nicer title, icon, colors, or controls text by adding an
           entry below. The key is the file name without ".html".
           Games with no entry here still show up, using their file name as the title.
           ========================================================================== */
        const GAME_DETAILS = {
            archers: {
                title: 'Archers Legend 3D',
                icon: 'fa-bullseye',
                bgGradient: 'from-purple-600 via-indigo-600 to-slate-900',
                controls: 'Click/Tap & drag back to aim, release to shoot targets.'
            }
            // Example:
            // space_man: {
            //     title: 'Space Man',
            //     icon: 'fa-user-astronaut',
            //     bgGradient: 'from-cyan-500 via-blue-600 to-indigo-900',
            //     controls: 'Arrow keys to move.'
            // }
        };

        // Colors given to games that have no entry above (picked by file name, so they stay the same)
        const FALLBACK_GRADIENTS = [
            'from-pink-600 via-rose-600 to-purple-900',
            'from-emerald-500 via-teal-700 to-slate-900',
            'from-amber-500 via-orange-600 to-red-900',
            'from-cyan-500 via-blue-600 to-indigo-900',
            'from-violet-600 via-purple-700 to-slate-900'
        ];

        let gamesData = [];
        let searchQuery = '';

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function prettyTitle(id) {
            return id.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim()
                     .replace(/\b\w/g, ch => ch.toUpperCase());
        }

        function hashId(id) {
            let h = 0;
            for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
            return h;
        }

        function buildGame(fileName) {
            const id = fileName.replace(/\.html$/i, '');
            const d = GAME_DETAILS[id] || {};
            return {
                id: id,
                title: d.title || prettyTitle(id),
                icon: d.icon || 'fa-gamepad',
                bgGradient: d.bgGradient || FALLBACK_GRADIENTS[hashId(id) % FALLBACK_GRADIENTS.length],
                controls: d.controls || 'Use keyboard or touch to play.',
                path: GAMES_FOLDER + '/' + encodeURIComponent(fileName)
            };
        }

        // Works out your GitHub username and repo name from the site address
        // (username.github.io/repo-name). If that ever guesses wrong, type them in above.
        function detectRepo() {
            let owner = REPO_OWNER;
            let repo = REPO_NAME;
            const host = location.hostname;
            if (host.endsWith('.github.io')) {
                if (!owner) owner = host.split('.')[0];
                if (!repo) {
                    const first = location.pathname.split('/').filter(Boolean)[0];
                    // No folder in the address means it's the special username.github.io repo
                    repo = (first && first.toLowerCase() !== 'index.html') ? first : host;
                }
            }
            return { owner, repo };
        }

        function readCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY));
                return Array.isArray(c) ? c : null;
            } catch (e) { return null; }
        }

        function saveCache(files) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(files)); } catch (e) {}
        }

        async function fetchGameFiles() {
            const { owner, repo } = detectRepo();
            if (!owner || !repo) throw new Error('Could not work out the GitHub repo from the address');
            const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + GAMES_FOLDER;
            const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
            if (!res.ok) throw new Error('GitHub answered ' + res.status);
            const items = await res.json();
            if (!Array.isArray(items)) throw new Error('Games folder not found');
            return items
                .filter(i => i.type === 'file' && /\.html$/i.test(i.name))
                .map(i => i.name)
                .sort((a, b) => a.localeCompare(b));
        }

        async function loadGames() {
            let files = null;
            try {
                files = await fetchGameFiles();
                saveCache(files);          // remember it in case GitHub can't be reached next time
            } catch (err) {
                console.warn('Live games lookup failed, using backup list:', err);
                // Backup 1: the last list that worked on this device
                files = readCache();
                // Backup 2: the games named in GAME_DETAILS above
                if (!files || files.length === 0) {
                    files = Object.keys(GAME_DETAILS).map(id => id + '.html');
                }
            }
            gamesData = files.map(buildGame);
            renderGrid();
        }

        function showMessage(title, body) {
            document.getElementById('gamesGrid').innerHTML = '';
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageBody').textContent = body;
            document.getElementById('messageState').classList.remove('hidden');
        }

        function renderGrid() {
            const grid = document.getElementById('gamesGrid');
            const filtered = gamesData.filter(g =>
                g.title.toLowerCase().includes(searchQuery) || g.id.toLowerCase().includes(searchQuery)
            );

            document.getElementById('gameCountBadge').textContent =
                filtered.length + (filtered.length === 1 ? ' game' : ' games');

            if (filtered.length === 0) {
                showMessage(
                    gamesData.length === 0 ? 'No games yet' : 'No games found',
                    gamesData.length === 0
                        ? 'Add a .html file to the Games folder and it will appear here.'
                        : 'Try a different search.'
                );
                return;
            }
            document.getElementById('messageState').classList.add('hidden');

            grid.innerHTML = filtered.map(game => `
                <button type="button" data-id="${escapeHtml(game.id)}"
                    class="poki-card group relative text-left bg-white dark:bg-poki-darkCard rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800/80 shadow-md hover:shadow-xl cursor-pointer flex flex-col">

                    <div class="h-36 sm:h-40 w-full bg-gradient-to-br ${game.bgGradient} relative flex items-center justify-center overflow-hidden">
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors"></div>
                        <div class="relative z-10 text-4xl sm:text-5xl text-white/90 drop-shadow-md group-hover:scale-110 transition-transform">
                            <i class="fas ${escapeHtml(game.icon)}"></i>
                        </div>
                        <div class="absolute inset-0 bg-poki-purple/80 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center z-20">
                            <span class="px-4 py-2 bg-white text-poki-purple font-black text-xs rounded-full shadow-lg flex items-center gap-1.5">
                                <i class="fas fa-play"></i> PLAY
                            </span>
                        </div>
                    </div>

                    <div class="p-3">
                        <h3 class="font-bold text-sm text-slate-800 dark:text-white truncate group-hover:text-poki-purple dark:group-hover:text-poki-violet transition-colors">${escapeHtml(game.title)}</h3>
                    </div>
                </button>
            `).join('');

            grid.querySelectorAll('button[data-id]').forEach(btn => {
                btn.addEventListener('click', () => launchGame(btn.dataset.id));
            });
        }

        /* ==================== GAME LAUNCHER MODAL ==================== */
        function launchGame(gameId) {
            const game = gamesData.find(g => g.id === gameId);
            if (!game) return;

            document.getElementById('modalGameTitle').textContent = game.title;
            document.getElementById('modalControlsGuide').textContent = game.controls;
            const icon = document.getElementById('modalGameIcon');
            icon.className = 'w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br ' + game.bgGradient + ' flex items-center justify-center text-white text-xl font-bold shadow-md';
            icon.innerHTML = '<i class="fas ' + escapeHtml(game.icon) + '"></i>';

            document.getElementById('gameIframe').src = game.path;

            const modal = document.getElementById('gameModal');
            const content = document.getElementById('gameModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeGameModal() {
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('gameModalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('gameIframe').src = 'about:blank'; // stops the game and frees memory
            }, 300);
        }

        function toggleFullscreen() {
            const iframe = document.getElementById('gameIframe');
            if (iframe.requestFullscreen) iframe.requestFullscreen();
            else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        }

        /* ==================== THEME ==================== */
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('poki_theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('poki_theme', 'dark');
            }
        }

        if (localStorage.getItem('poki_theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }

        /* ==================== START ==================== */
        window.addEventListener('DOMContentLoaded', () => {
            const onSearch = e => { searchQuery = e.target.value.toLowerCase().trim(); renderGrid(); };
            document.getElementById('searchInput').addEventListener('input', onSearch);
            document.getElementById('mobileSearchInput').addEventListener('input', onSearch);
            loadGames();
        });
    </script>
</body>
</html>
